name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore packages
        run: nuget restore Tai.sln

      - name: Build
        run: msbuild Tai.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tai-release
          path: |
            UI/bin/Release/
            Core/bin/Release/
            Updater/bin/Release/
          if-no-files-found: ignore

      - name: Package and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path UI/bin/Release/* -DestinationPath "Tai-${{ github.ref_name }}-portable.zip"
          gh release create "${{ github.ref_name }}" "Tai-${{ github.ref_name }}-portable.zip" --title "Tai ${{ github.ref_name }}" --generate-notes
