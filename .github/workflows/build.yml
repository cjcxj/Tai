name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '填写已发布的版本标签（如 v1.5.0.6）可重新打包并更新该 Release 的说明与产物'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore packages
        run: nuget restore Tai.sln

      - name: Build
        run: msbuild Tai.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tai-release
          path: |
            UI/bin/Release/
            Core/bin/Release/
            Updater/bin/Release/
          if-no-files-found: ignore

      - name: Package and publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          Compress-Archive -Path UI/bin/Release/* -DestinationPath "Tai-$env:TAG-portable.zip"
          git fetch --tags --force origin
          $notes = (git tag -l --format='%(contents:body)' $env:TAG) -join "`n"
          if ([string]::IsNullOrWhiteSpace($notes) -and (Test-Path RELEASE-NOTES.md)) { $notes = Get-Content RELEASE-NOTES.md -Raw }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Full Changelog: https://github.com/${{ github.repository }}/commits/$env:TAG" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          if (gh release view $env:TAG) {
            gh release edit $env:TAG --title "Tai $env:TAG" --notes-file release-notes.md
            gh release upload $env:TAG "Tai-$env:TAG-portable.zip" --clobber
          } else {
            gh release create $env:TAG "Tai-$env:TAG-portable.zip" --title "Tai $env:TAG" --notes-file release-notes.md
          }
